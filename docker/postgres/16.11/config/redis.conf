################################## NOTES ##################################
# PERSISTENCE STRATEGY:
# - AOF provides durability (lose at most ~1 second of data)
# - RDB provides compact backups and faster restarts (with aof-use-rdb-preamble)
# - On restart, Redis uses AOF if enabled (RDB is ignored for recovery)
# - RDB files are still useful for manual backups and disaster recovery

################################## PATHS ##################################

# Directory where both AOF and RDB files are stored
# In Docker, mount this as a volume for data persistence
dir /data

################################## PERSISTENCE ##################################

# -------------------- AOF (Append Only File) --------------------

# Enable AOF persistence for maximum durability
# AOF logs every write operation and can recover data up to ~1 second before crash
appendonly yes

# How often to fsync AOF data to disk:
# - always: fsync after every write (safest, slowest)
# - everysec: fsync once per second (recommended balance)
# - no: let OS decide when to fsync (fastest, least safe)
appendfsync everysec

# Use RDB format as preamble in AOF file for faster restarts
# AOF file structure: [RDB snapshot] + [recent AOF commands]
# This combines RDB's fast loading with AOF's durability
aof-use-rdb-preamble yes

# Trigger AOF rewrite when file size grows by this percentage
# 100 means rewrite when file doubles in size
auto-aof-rewrite-percentage 100

# Only trigger AOF rewrite if file is at least this size
# Prevents unnecessary rewrites when file is still small
auto-aof-rewrite-min-size 64mb

# Continue fsync during AOF rewrite (safer but may impact performance)
# no = continue fsync (recommended for data safety)
# yes = pause fsync during rewrite (faster but riskier)
no-appendfsync-on-rewrite no

# Attempt to load AOF file even if truncated (can happen after crash)
# Allows recovery from incomplete AOF files instead of failing to start
aof-load-truncated yes

# Fsync AOF rewrite incrementally to avoid large I/O spikes
# Spreads disk writes over time instead of one large sync at the end
aof-rewrite-incremental-fsync yes

# -------------------- RDB (Redis Database Snapshots) --------------------

# Create point-in-time snapshots based on time and number of changes
# Format: save <seconds> <changes>
# Save after 15 minutes if at least 1 key changed
save 900 1      
# Save after 5 minutes if at least 10 keys changed
save 300 10     
# Save after 60 seconds if at least 10,000 keys changed
save 60 10000   

# Compress RDB files to save disk space (uses LZF compression)
rdbcompression yes

# Add checksum at end of RDB file for corruption detection
# Slightly increases save/load time but improves data integrity
rdbchecksum yes

# Stop accepting writes if RDB background save fails
# Prevents operating in a mode where data might be silently lost
# yes = prioritize data safety over availability (recommended)
stop-writes-on-bgsave-error yes

